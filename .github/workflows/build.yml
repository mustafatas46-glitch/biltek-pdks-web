name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BiltekPdks.sln
      - name: Build
        run: dotnet build BiltekPdks.sln --no-restore -c Release
      - name: Test
        run: dotnet test BiltekPdks.sln --no-build -c Release --logger "console;verbosity=normal"
