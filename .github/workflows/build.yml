name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      migration:
        description: "Oluşturulacak migration adı (boşsa yalnızca derle/test et)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      eskimysql:
        image: mysql:5.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: data2015
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BiltekPdks.sln
      - name: Build
        run: dotnet build BiltekPdks.sln --no-restore -c Release -warnaserror:nullable- 2>&1 | tee build.log
      - name: Derleme uyarilari
        if: always()
        run: |
          n=$(grep -c "warning CS" build.log || true)
          echo "::notice title=Derleme::$n derleyici uyarisi"
          grep "warning CS" build.log | sed -E 's#.*/(src|tests)/#\1/#' | sort -u | head -20 | while read -r l; do echo "::warning::$l"; done
      - name: Test
        env:
          ESKI_MYSQL_TEST: "Server=127.0.0.1;Port=3307;Database=data2015;User=root;Password=root"
        run: dotnet test BiltekPdks.sln --no-build -c Release --logger "trx;LogFileName=sonuc.trx" --results-directory testsonuc
      - name: Test ozeti
        if: always()
        run: |
          f=$(find testsonuc -name '*.trx' | head -1)
          if [ -z "$f" ]; then echo "::error title=Test::Sonuc dosyasi yok"; exit 1; fi
          ozet=$(grep -o '<Counters [^>]*>' "$f")
          echo "::notice title=Test ozeti::$ozet"
          total=$(echo "$ozet" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
          if [ "${total:-0}" -eq 0 ]; then echo "::error title=Test::Hic test calismadi"; exit 1; fi
          python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse(sys.argv[1]).getroot()
          for r in root.iterfind(".//t:UnitTestResult", ns):
              if r.get("outcome") != "Failed":
                  continue
              msg = (r.findtext(".//t:Message", default="", namespaces=ns) or "").strip()
              st = (r.findtext(".//t:StackTrace", default="", namespaces=ns) or "").strip()
              text = (msg + "\n" + st)[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={r.get('testName')}::{text}")
          PY

  windows-paketi:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Yayinla (win-x64, .NET kurulumu gerektirmez)
        shell: pwsh
        run: |
          dotnet publish src/BiltekPdks.Web -c Release -r win-x64 --self-contained true -o paket/BiltekPdks/web
          dotnet publish tools/BiltekPdks.Aktarim -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o paket/BiltekPdks/aktarim
          Copy-Item paket-ek/*.bat, paket-ek/*.txt, paket-ek/*.ps1 paket/BiltekPdks/
      - name: Windows'ta calistirip dogrula
        shell: pwsh
        run: |
          $kok = Resolve-Path paket/BiltekPdks
          $env:ASPNETCORE_URLS = "http://localhost:5180"
          $env:ConnectionStrings__Pdks = "Data Source=$env:RUNNER_TEMP\smoke.db"
          $env:Veritabani__Saglayici = "Sqlite"
          $p = Start-Process -FilePath "$kok/web/BiltekPdks.Web.exe" -WorkingDirectory "$env:RUNNER_TEMP" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/web.log" -RedirectStandardError "$env:RUNNER_TEMP/web.err"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri "http://localhost:5180/hesap/giris" -UseBasicParsing; $ok = $r.StatusCode -eq 200 -and $r.Content.Contains("Giriş") } catch { }
          }
          $css = $false
          if ($ok) {
            # Programi baska klasorden baslatinca da stil dosyalari gelmeli (kullanici exe'ye cift tiklayabilir).
            try {
              $a = Invoke-WebRequest -Uri "http://localhost:5180/app.css" -UseBasicParsing
              $b = Invoke-WebRequest -Uri "http://localhost:5180/lib/bootstrap.min.css" -UseBasicParsing
              $css = $a.StatusCode -eq 200 -and $a.Content.Contains(".ust-menu") -and $b.StatusCode -eq 200 -and $b.RawContentLength -gt 100000
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:RUNNER_TEMP/web.log" -Tail 20
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP/web.err" -Tail 40; Write-Output "::error title=Windows::Program acilmadi"; exit 1 }
          if (-not $css) { Write-Output "::error title=Windows::Stil dosyalari (app.css / bootstrap) gelmedi"; exit 1 }
          Write-Output "::notice title=Windows::Program Windows'ta acildi, giris sayfasi ve stil dosyalari 200 dondu"
          # Bulut (firma basina ayri veritabani) modu da Windows'ta acilmali.
          $env:ASPNETCORE_URLS = "http://localhost:5181"
          $env:Veritabani__Mod = "FirmaBasina"
          $env:ConnectionStrings__Katalog = "Data Source=$env:RUNNER_TEMP\bulut\katalog.db"
          $env:ConnectionStrings__FirmaSablonu = "Data Source=$env:RUNNER_TEMP\bulut\{kod}\pdks.db"
          $env:Kurulum__FirmaKodu = "BILTEK"
          $env:Kurulum__YoneticiSifresi = "Deneme12345"
          $env:Sistem__YonetimFirmasi = "BILTEK"
          $p2 = Start-Process -FilePath "$kok/web/BiltekPdks.Web.exe" -WorkingDirectory "$env:RUNNER_TEMP" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/web2.log" -RedirectStandardError "$env:RUNNER_TEMP/web2.err"
          $ok2 = $false
          for ($i = 0; $i -lt 60 -and -not $ok2; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri "http://localhost:5181/hesap/giris" -UseBasicParsing; $ok2 = $r.StatusCode -eq 200 } catch { }
          }
          Stop-Process -Id $p2.Id -Force
          if (-not $ok2 -or -not (Test-Path "$env:RUNNER_TEMP\bulut\biltek\pdks.db")) { Get-Content "$env:RUNNER_TEMP/web2.err" -Tail 40; Write-Output "::error title=Windows::Bulut modu acilmadi"; exit 1 }
          Write-Output "::notice title=Windows::Bulut modu (firma basina veritabani) Windows'ta acildi"
          Remove-Item Env:Veritabani__Mod, Env:ConnectionStrings__Katalog, Env:ConnectionStrings__FirmaSablonu, Env:Kurulum__FirmaKodu, Env:Kurulum__YoneticiSifresi, Env:Sistem__YonetimFirmasi
          # Sunucu kurulum betigi soz dizimi hatasiz olmali.
          $hatalar = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path paket-ek/3-sunucuya-kur.ps1), [ref]$null, [ref]$hatalar) | Out-Null
          if ($hatalar.Count -gt 0) { $hatalar | ForEach-Object { Write-Output "::error title=ps1::$($_.Message)" }; exit 1 }
          & "$kok/aktarim/pdks-aktarim.exe" | Out-Null
          if ($LASTEXITCODE -ne 2) { Write-Output "::error title=Windows::Aktarim araci beklenmedik cikis kodu $LASTEXITCODE"; exit 1 }
          Write-Output "::notice title=Windows::Aktarim araci calisiyor"
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: BiltekPdks-Windows
          path: paket/
          retention-days: 30

  ekran-goruntuleri:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Uygulamayi ornek veriyle baslat
        env:
          ASPNETCORE_URLS: http://localhost:5180
          ConnectionStrings__Pdks: Data Source=/tmp/demo.db
          Veritabani__Saglayici: Sqlite
          Kurulum__FirmaAdi: Örnek Tekstil A.Ş.
          Kurulum__YoneticiSifresi: Demo12345
          Kurulum__DemoVeri: "true"
          TZ: Europe/Istanbul
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --no-launch-profile --project src/BiltekPdks.Web -c Release > /tmp/web.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5180/hesap/giris >/dev/null && break; sleep 2; done
          tail -5 /tmp/web.log
      - name: Ekran goruntulerini al
        run: |
          set +e
          pip install playwright==1.47.0 > /tmp/pip.log 2>&1 || { echo "::error title=pip::$(tail -3 /tmp/pip.log | tr '\n' ' ')"; exit 1; }
          python -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { echo "::error title=playwright::$(tail -3 /tmp/pw.log | tr '\n' ' ')"; exit 1; }
          mkdir -p ekran
          python tools/ekran/ekran_goruntusu.py http://localhost:5180 Demo12345 ekran > /tmp/py.log 2>&1
          kod=$?
          echo "::notice title=Ekran::$(ls ekran | tr '\n' ' ')"
          if [ $kod -ne 0 ]; then
            echo "::error title=Ekran betigi::$(tail -15 /tmp/py.log | tr '\n' ' ' | cut -c1-1500)"
            echo "::error title=Web log::$(tail -15 /tmp/web.log | tr '\n' ' ' | cut -c1-1500)"
          fi
          exit 0
      - name: ekran-goruntuleri dalina yukle
        run: |
          cd ekran
          git init -q -b ekran-goruntuleri
          git -c user.name="ci" -c user.email="ci@localhost" add .
          git -c user.name="ci" -c user.email="ci@localhost" commit -qm "Ekran goruntuleri ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekran-goruntuleri

  migration-olustur:
    if: github.event_name == 'workflow_dispatch' && inputs.migration != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Migration uret (SQLite + MySQL)
        env:
          AD: ${{ inputs.migration }}
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          for c in Sqlite MySql; do
            dotnet ef migrations add "$AD" --context ${c}PdksDbContext --output-dir Migrations/$c \
              --project src/BiltekPdks.Infrastructure --startup-project src/BiltekPdks.Infrastructure
          done
      - name: Dala yukle
        env:
          AD: ${{ inputs.migration }}
        run: |
          git config user.name "ci"
          git config user.email "ci@localhost"
          git status --porcelain
          echo "::notice title=Uretilen dosyalar::$(git status --porcelain | tr '\n' ' ')"
          git checkout -b "migration/$AD"
          git add -A src
          git commit -m "Migration: $AD"
          git push -f origin "migration/$AD"
