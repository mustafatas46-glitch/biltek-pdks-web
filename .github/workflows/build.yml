name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BiltekPdks.sln
      - name: Build
        run: dotnet build BiltekPdks.sln --no-restore -c Release -warnaserror:nullable- 2>&1 | tee build.log
      - name: Derleme uyarilari
        if: always()
        run: |
          n=$(grep -c "warning CS" build.log || true)
          echo "::notice title=Derleme::$n derleyici uyarisi"
          grep "warning CS" build.log | sed -E 's#.*/(src|tests)/#\1/#' | sort -u | head -20 | while read -r l; do echo "::warning::$l"; done
      - name: Test
        run: dotnet test BiltekPdks.sln --no-build -c Release --logger "trx;LogFileName=sonuc.trx" --results-directory testsonuc
      - name: Test ozeti
        if: always()
        run: |
          f=$(find testsonuc -name '*.trx' | head -1)
          if [ -z "$f" ]; then echo "::error title=Test::Sonuc dosyasi yok"; exit 1; fi
          ozet=$(grep -o '<Counters [^>]*>' "$f")
          echo "::notice title=Test ozeti::$ozet"
          total=$(echo "$ozet" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
          if [ "${total:-0}" -eq 0 ]; then echo "::error title=Test::Hic test calismadi"; exit 1; fi
          python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse(sys.argv[1]).getroot()
          for r in root.iterfind(".//t:UnitTestResult", ns):
              if r.get("outcome") != "Failed":
                  continue
              msg = (r.findtext(".//t:Message", default="", namespaces=ns) or "").strip()
              st = (r.findtext(".//t:StackTrace", default="", namespaces=ns) or "").strip()
              text = (msg + "\n" + st)[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={r.get('testName')}::{text}")
          PY
