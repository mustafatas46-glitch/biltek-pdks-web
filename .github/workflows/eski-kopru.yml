name: eski-kopru
on:
  push:
    paths: ['tools/EskiMuhasebeKoprusu/**', '.github/workflows/eski-kopru.yml']
  workflow_dispatch:
jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: csc (.NET Framework, C# 5, x86)
        shell: cmd
        run: |
          cd tools\EskiMuhasebeKoprusu
          set CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe
          "%CSC%" /nologo /target:winexe /platform:x86 /optimize+ /codepage:65001 /out:BiltekMuhasebeKoprusu.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Xml.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll *.cs > sonuc.txt 2>&1
          type sonuc.txt
          for /f "usebackq delims=" %%L in (`findstr /i "error warning" sonuc.txt`) do echo ::warning::%%L
          if not exist BiltekMuhasebeKoprusu.exe (echo ::error::DERLEME HATALI & exit /b 1)
          cd FbSema
          "%CSC%" /nologo /target:exe /platform:x86 /codepage:65001 /out:FbSema.exe /r:System.dll /r:System.Core.dll FbSema.cs ..\Fb.cs > sonuc.txt 2>&1
          type sonuc.txt
          for /f "usebackq delims=" %%L in (`findstr /i "error warning" sonuc.txt`) do echo ::warning::FbSema %%L
          if not exist FbSema.exe (echo ::error::FbSema DERLEME HATALI & exit /b 1)
          echo ::notice::DERLEME TAMAM
      - name: Firebird 2.5 embedded ile dene
        shell: pwsh
        run: |
          $u = "https://github.com/FirebirdSQL/firebird/releases/download/R2_5_9/Firebird-2.5.9.27139-0_Win32_embed.zip"
          Invoke-WebRequest $u -OutFile fb.zip
          Expand-Archive fb.zip -DestinationPath fbemb
          $d = "tools/EskiMuhasebeKoprusu/FbSema"
          Copy-Item fbemb/* $d -Recurse -Force
          Copy-Item "$d/fbembed.dll" "$d/fbclient.dll" -Force
          Get-ChildItem $d | Select-Object Name | Out-String | Write-Output
          $db = (Resolve-Path $d).Path + "\TEST.GDB"
          $sql = @"
          CREATE DATABASE '$db' USER 'SYSDBA' PASSWORD 'masterkey' DEFAULT CHARACTER SET WIN1254;
          CREATE TABLE PERSONEL (PERID INTEGER NOT NULL PRIMARY KEY, KARTNO VARCHAR(10), AD VARCHAR(30), SOYAD VARCHAR(30), KIMLIKNO VARCHAR(11), IGTARIH DATE, MAAS NUMERIC(15,2), GSAAT TIME, ZAMAN TIMESTAMP, ADET SMALLINT, ORAN DOUBLE PRECISION, NOT1 CHAR(5));
          INSERT INTO PERSONEL VALUES (1,'0001','ŞÜKRÜ','ĞÜLÇİN','12345678901','2024-03-15',12345.67,'08:30:00','2025-01-02 17:45:10',3,1.5,'ab');
          INSERT INTO PERSONEL (PERID) VALUES (2);
          COMMIT;
          "@
          Set-Content -Path ilk.sql -Value $sql -Encoding Default
          & "fbemb/isql.exe" -i ilk.sql -ch WIN1254 2>&1 | Write-Output
          Push-Location $d
          ./FbSema.exe $db masterkey
          $kod = $LASTEXITCODE
          Get-Content sema_raporu.txt -Encoding UTF8 | Write-Output
          Pop-Location
          if ($kod -ne 0) { Write-Output "::error::FbSema hata verdi"; exit 1 }
          $r = Get-Content "$d/sema_raporu.txt" -Encoding UTF8 -Raw
          if ($r -notmatch "2024-03-15" -or $r -notmatch "12345.67" -or $r -notmatch "08:30:00" -or $r -notmatch "2025-01-02 17:45:10") { Write-Output "::error::Tip cozme hatali"; exit 1 }
          Write-Output "::notice::Firebird okuma testi TAMAM"
